name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meu-aplicador-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk meu-aplicador.apk
          gh release delete apk-teste --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-teste meu-aplicador.apk --title "Meu Aplicador (APK de teste)" --notes "Baixe o arquivo meu-aplicador.apk no celular Android e instale. APK de teste, sem assinatura da Play Store."
